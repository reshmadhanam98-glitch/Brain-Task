apiVersion: apps/v1
kind: Deployment

metadata:
  name: brain-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: brain

  template:
    metadata:
      labels:
        app: brain

    spec:
      containers:
      - name: brain-app
        image: reshmadocker98/brain-tasks-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
